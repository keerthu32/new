<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital Twin | Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  </head>
  <body>
    <nav class="navbar">
      <span class="brand-text">Digital Twin</span>
      <div class="nav-links">
        <a href="/">Home</a>
        <a href="/results">Results</a>
      </div>
    </nav>

    <main class="page-wrap" id="dashboard-root">
      <h1 class="page-title">SYSTEM DASHBOARD</h1>
      <div class="page-subtitle">REAL-TIME CIRCUIT HEALTH MONITORING</div>

      <section class="metrics-grid">
        <div class="metric">
          <div class="metric-label">Current</div>
          <div id="m-current" class="metric-value">--</div>
        </div>
        <div class="metric">
          <div class="metric-label">Temperature</div>
          <div id="m-temp" class="metric-value">--</div>
        </div>
        <div class="metric">
          <div class="metric-label">Degradation</div>
          <div id="m-degradation" class="metric-value">--</div>
        </div>
        <div class="metric">
          <div class="metric-label">Failure Risk</div>
          <div id="m-risk" class="metric-value">--</div>
        </div>
      </section>

      <section class="twin-layout" style="margin-top: 1rem;">
        <article class="card">
          <h3 style="margin-top: 0;">3D Circuit Twin</h3>
          <div id="three-twin"></div>
        </article>

        <aside class="card">
          <h3 style="margin-top: 0;">Battery + Source</h3>
          <div class="metric-label">Data Source</div>
          <div id="m-source" class="metric-value" style="font-size: 1rem;">--</div>
          <div class="metric-label" style="margin-top: 0.8rem;">Battery Level</div>
          <div id="battery"><div id="battery-level"></div></div>

          <h3 style="margin: 1.2rem 0 0.5rem;">Telemetry Trend</h3>
          <div class="graph-wrap">
            <canvas id="trend-chart"></canvas>
          </div>
        </aside>
      </section>
    </main>

    <script src="/static/js/main.js"></script>
  </body>
</html>
